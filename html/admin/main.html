<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			http-equiv="X-UA-Compatible"
			content="IE=edge" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

		<meta
			name="application-name"
			content="Track Elite" />

		<link
			rel="stylesheet"
			href="/css/animation.css" />
		<link
			rel="stylesheet"
			href="./css/main.css" />

		<link
			rel="stylesheet"
			href="/css/gen.css" />

		<link
			rel="apple-touch-icon"
			href="/src/svg/favicon.svg" />

		<link
			rel="shortcut icon"
			href="/src/svg/favicon.svg"
			type="image/x-icon/svg" />

		<link
			rel="preconnect"
			href="https://fonts.googleapis.com" />
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
			rel="stylesheet" />

		<script
			defer
			src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

		<script
			defer
			src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

		<title>Track Elite | Admin | Main</title>
	</head>
	<body class="fadeIn">
		<header class="leftIntro">
			<p class="welcome spread">
				Welcome, <span class="highlight">Admin!</span>
			</p>
		</header>

		<div class="circle leftIntro"></div>
		<div class="circle1 rightIntro"></div>
		<div class="circle2 leftIntro"></div>
		<div class="circle3 rightIntro"></div>
		<div class="circle4 leftIntro"></div>
		<div class="circle5 rightIntro"></div>

		<section class="panel">
			<div class="admin-label">
				<h2>Admin Panel</h2>

				<div class="left">
					<button id="logout">Log Out</button>
					<a
						href="/html/home.html"
						class="website"
						target="_blank"
						>View Site</a
					>
				</div>
			</div>

			<!-- Package creation section  -->
			<div class="package drop dropdown">
				<div class="top">
					<h3>Control Package</h3>
					<div class="arrow">></div>
				</div>
				<form class="input-div">
					<input
						type="text"
						required
						placeholder="Package Name"
						id="pack" />

					<input
						type="text"
						required
						placeholder="Customer Name"
						id="name" />

					<input
						type="email"
						id="email"
						required
						placeholder="Customer Email" />

					<input
						type="text"
						placeholder="Tracking ID"
						required
						id="id"
						autocapitalize="true"
						maxlength="16" />

					<input
						type="text"
						placeholder="Country A"
						id="from" />

					<input
						type="text"
						placeholder="Current"
						id="current" />

					<input
						type="text"
						placeholder="Country B"
						id="to" />

					<input
						type="text"
						placeholder="Company Address"
						id="company" />

					<input
						type="text"
						required
						placeholder="Customer Address"
						id="address" />

					<input
						type="text"
						placeholder="Price"
						id="price" />

					<input
						type="text"
						placeholder="GiftCard?"
						id="gcard" />

					<input
						type="text"
						id="arriveIn"
						placeholder="Arrival Date" />

					<p id="warning"></p>

					<div class="down">
						<button
							id="add"
							type="submit">
							ADD
						</button>
					</div>
				</form>
			</div>

			<!-- verify section  -->
			<div class="view drop leftIntro">
				<div class="top">
					<h3>Edit Package</h3>
					<div class="arrow">></div>
				</div>
				<div class="input-div">
					<div class="details">
						<div class="upper">
							<div class="uID">
								<label for="user-ID">ID:</label>
								<input
									type="text"
									class="id"
									placeholder="Tracking ID" />

								<span
									id="fetch"
									title="Fecth Package">
									>
								</span>
							</div>

							<div class="name">
								<label for="name">Name:</label>
								<p class="name">Customer Name</p>
							</div>

							<div class="email">
								<label for="email">Email:</label>
								<p class="email">Customer Email</p>
							</div>

							<div class="current">
								<label for="current">Current:</label>
								<input
									type="text"
									class="current"
									placeholder="Currently In?" />
							</div>

							<div class="arrived">
								<label for="uArrived">Arrived:</label>
								<input
									type="text"
									class="arrive"
									placeholder="Arrived?" />
							</div>

							<div class="arriveIn">
								<label for="amount">Arrive In:</label>
								<input
									type="text"
									class="arriveIn"
									placeholder="Arrives In" />
							</div>

							<div class="duration">
								<label for="duration">Duration:</label>
								<input
									type="text"
									class="duration"
									placeholder="Duration" />
							</div>

							<div class="amount">
								<label for="amount">Amount:</label>
								<input
									type="text"
									class="price"
									placeholder="Amount" />
							</div>
						</div>
						<div class="buttons">
							<button id="delete-package">DELETE</button>
							<button id="edit-package">EDIT</button>
						</div>
					</div>
				</div>
			</div>

			<!-- payment section  -->
			<div class="payment drop leftIntro">
				<div class="top">
					<h3>Payment Method</h3>
					<div class="arrow">></div>
				</div>
				<div class="input-div">
					<div class="paypal-div div">
						<input
							type="text"
							required
							placeholder="Paypal"
							id="paypal" />

						<button
							id="update-ppal"
							class="update">
							Update
						</button>
					</div>

					<div class="bank-div div">
						<input
							type="text"
							required
							placeholder="Bank Transfer"
							id="bank" />

						<button
							id="update-bank"
							class="update">
							Update
						</button>
					</div>

					<div class="venmo-div div">
						<input
							type="text"
							required
							placeholder="Venmo"
							id="venmo" />

						<button
							id="update-venmo"
							class="update">
							Update
						</button>
					</div>

					<div class="applepay-div div">
						<input
							type="text"
							required
							placeholder="Apple Pay"
							id="applepay" />

						<button
							id="update-apple"
							class="update">
							Update
						</button>
					</div>

					<div class="cashapp-div div">
						<input
							type="text"
							required
							placeholder="Cash App"
							id="cashApp" />

						<button
							id="update-cash-app"
							class="update">
							Update
						</button>
					</div>

					<div class="chime-div div">
						<input
							type="text"
							required
							placeholder="Chime"
							id="chime" />

						<button
							id="update-chime"
							class="update">
							Update
						</button>
					</div>

					<div class="bitcoin-div div">
						<input
							type="text"
							required
							placeholder="Bitcoin"
							id="bitcoin" />

						<button
							id="update-bitcoin"
							class="update">
							Update
						</button>
					</div>

					<div class="zelle-div div">
						<input
							type="text"
							required
							placeholder="Zelle"
							id="zelle" />

						<button
							id="update-zelle"
							class="update">
							Update
						</button>
					</div>
				</div>
			</div>

			<!-- verify section  -->
			<div class="verify drop leftIntro">
				<div class="top">
					<h3>Verify Payment</h3>
					<div class="arrow">></div>
				</div>
				<div class="input-div">
					<div class="reciepts">
						<img
							src="/src/svg/image.svg"
							alt="Customer Reciept"
							class="receipt" />
					</div>

					<div class="details">
						<div class="upper">
							<div class="uID">
								<label for="user-ID">ID:</label>
								<input
									type="text"
									class="user-ID"
									id="user-ID"
									placeholder="Tracking ID" />

								<span
									id="reload"
									title="Reload Payment">
									>
								</span>
							</div>
							<div class="name">
								<label for="name">Sender Name:</label>
								<p class="name">-- -- --</p>
							</div>
							<div class="tel">
								<label for="uTel">Sender Tel:</label>
								<p class="uTel">-- -- --</p>
							</div>
							<div class="email">
								<label for="uEmail">Sender Email:</label>
								<p class="uEmail">-- -- --</p>
							</div>
						</div>

						<div class="lower">
							<div class="price">
								<label for="uPrice">Amount:</label>
								<p
									class="uPrice"
									style="color: rgb(18, 164, 26)">
									---
								</p>
							</div>

							<div class="method">
								<label for="uMethod">Method:</label>
								<p class="uMethod">...</p>
							</div>

							<div class="paid">
								<label for="uPaid">Paid:</label>
								<p class="uPaid">-- --</p>
							</div>

							<div class="success">
								<label for="success">Success:</label>
								<input
									type="text"
									class="success"
									placeholder="Success?"
									required />
							</div>
						</div>
						<button
							id="confirm-payment"
							type="submit">
							CONFIRM
						</button>
					</div>
				</div>
			</div>

			<!-- Visitors section  -->
			<div class="visitors drop rightIntro">
				<div class="top">
					<h3>Visitors</h3>
					<div class="arrow">></div>
				</div>
				<div id="visitors-div"></div>
			</div>

			<!-- Visitors section  -->
			<div class="paymentNotif drop leftIntro">
				<div class="top">
					<h3>Payment Notification</h3>
					<div class="arrow">></div>
				</div>
				<div id="notification-div"></div>
			</div>

			<!-- password section  -->
			<div class="password drop leftIntro">
				<div class="top">
					<h3>Change Password</h3>
					<div class="arrow">></div>
				</div>
				<div class="input-div">
					<input
						type="text"
						required
						placeholder="Default Password"
						id="default" />

					<input
						type="text"
						placeholder="New Password"
						id="new" />

					<p class="warning password"></p>

					<button id="change-password">CHANGE</button>
				</div>
			</div>
		</section>
	</body>
	<footer>
		<div class="copyright">Copyright &copy; <span id="year">2024</span></div>
	</footer>
</html>

<script
	src="/js/fbase.js"
	defer
	type="module"></script>

<script
	src="./js/main.js"
	type="module"></script>

<script
	src="./js/dom.js"
	type="module"></script>

<script
	src="./js/update.js"
	type="module"></script>
